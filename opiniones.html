<!DOCTYPE html>
<html lang="es">
<head>

 <link rel="icon" type="image/x-icon" href="imagenes/logo.jpg">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos/estilos-opiniones.css">
</head>
<body>

<header class="header">
    <div class="logo">BOCA<span>BESTIA</span></div>
    <input type="checkbox" id="menu-toggle" class="menu-toggle-input" aria-label="Abrir menú">
    <label for="menu-toggle" class="menu-toggle" aria-label="Menú hamburguesa">
      <img src="imagenes/menu-hamburguesa.png" alt="Menú hamburguesa">
    </label>
    <nav class="nav">
      <a href="index.html#inicio">Inicio</a>
      <a href="https://bocabestia.last.shop/qr/l/boca-bestia">La Carta</a>
      <a href="index.html#nosotros">Nosotros</a>
      <a href="index.html#ubicacion">Ubicación</a>
      <a href="https://bookings.last.app/3b10a1be-e4e0-4e58-9fa3-591195b8b607/booking?_gl=1*1hvvvue*_gcl_au*MTg0ODkxNjIzNy4xNzc5MDg5NDAzLjE2MTM1ODUwNy4xNzg0NzA4MzI3LjE3ODQ3MTAwMjUuMTUzNjg0NTM3NC4xNzg0NjQxMDk0LjE3ODQ3MTAwMjU.">Reserva</a>
    </nav>
    <a href="https://www.ubereats.com/es/store/bocabestia-jerez/Wji_4HXeWGeH31o7zRoD1A?srsltid=AfmBOoqhJCSY1oyDkX2ZfFhng03Me69ej4izlgKsJas9yPGN5HKDivDR" class="btn btn-rojo">Pide Online</a>
</header>

<div class="container">

    <div class="card">

        <h2>¡Comparte tu opinión con nosotros!</h2>

        <input type="text" id="nombre" placeholder="Nombre del cliente">

        <label>🍔 Comida</label>
        <select id="comida">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
        </select>

        <label>👨‍🍳 Servicio</label>
        <select id="servicio">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
        </select>

        <label>🏠 Ambiente</label>
        <select id="ambiente">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
        </select>

        <textarea id="comentario" rows="5" placeholder="Escribe la opinión..."></textarea>

        <button onclick="guardarOpinion()">Publicar Opinión</button>

    </div>
</div>

<footer id="contacto" class="footer">
    <div>
      <h3>BOCABESTIA</h3>
      <p>Jerez de la Frontera, Cádiz</p>
    </div>
    <div class="footer-contacto">
        <h3>Redes Sociales</h3>
        <p>Síguenos en nuestras redes sociales para más novedades.</p>
        <div class="redes-sociales">
            <img src="imagenes/Instagram_icon.png" alt="Instagram" class="footer-ig">
            <a href="https://www.instagram.com/bocabestia/" target="_blank" rel="noopener noreferrer">Instagram</a>
        </div>
    </div>
    <div>
      <p>&copy; 2026 BocaBestia · 2WEB Project</p>
    </div>
  </footer>
<script>

let opiniones = JSON.parse(localStorage.getItem("opiniones")) || [];

mostrarOpiniones();

function guardarOpinion(){

    let nombre = document.getElementById("nombre").value;
    let comida = document.getElementById("comida").value;
    let servicio = document.getElementById("servicio").value;
    let ambiente = document.getElementById("ambiente").value;
    let comentario = document.getElementById("comentario").value;

    if(nombre === "" || comentario === ""){
        alert("Completa todos los campos");
        return;
    }

    opiniones.unshift({
        nombre,
        comida,
        servicio,
        ambiente,
        comentario,
        fecha: new Date().toLocaleDateString()
    });

    localStorage.setItem("opiniones", JSON.stringify(opiniones));

    document.getElementById("nombre").value = "";
    document.getElementById("comentario").value = "";
    document.getElementById("comida").value = "5";
    document.getElementById("servicio").value = "5";
    document.getElementById("ambiente").value = "5";

    mostrarOpiniones();
}

function mostrarOpiniones(){

    let contenedor = document.getElementById("opiniones");

    contenedor.innerHTML = "<h2>Opiniones Publicadas</h2>";

    opiniones.forEach((opinion,index)=>{

        let media = (
            parseInt(opinion.comida) +
            parseInt(opinion.servicio) +
            parseInt(opinion.ambiente)
        ) / 3;

        contenedor.innerHTML += `
        <div class="review">

            <button class="delete" onclick="eliminar(${index})">
                Eliminar
            </button>

            <h3>${opinion.nombre}</h3>

            <p><strong>⭐ Media:</strong> ${media.toFixed(1)}</p>

            <p><strong>🍔 Comida:</strong>
            ${"⭐".repeat(opinion.comida)}</p>

            <p><strong>👨‍🍳 Servicio:</strong>
            ${"⭐".repeat(opinion.servicio)}</p>

            <p><strong>🏠 Ambiente:</strong>
            ${"⭐".repeat(opinion.ambiente)}</p>

            <p>"${opinion.comentario}"</p>

            <small>${opinion.fecha}</small>

        </div>
        `;
    });
}

function eliminar(index){

    if(confirm("¿Eliminar esta opinión?")){

        opiniones.splice(index,1);

        localStorage.setItem(
            "opiniones",
            JSON.stringify(opiniones)
        );

        mostrarOpiniones();
    }
}

</script>

</body>
</html>
